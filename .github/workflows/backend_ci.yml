name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'NeighborGoods.Api/**'
      - 'NeighborGoods.Api.Tests/**'
      - 'NeighborGoods.Data/**'
      - 'NeighborGoods.Notifications/**'
      - 'NeighborGoods.Messaging/**'
      - 'NeighborGoods.Workers/**'
      - 'NeighborGoods.Functions/**'
      - 'Dockerfile.api'
      - '.github/workflows/backend_ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'NeighborGoods.Api/**'
      - 'NeighborGoods.Api.Tests/**'
      - 'NeighborGoods.Data/**'
      - 'NeighborGoods.Notifications/**'
      - 'NeighborGoods.Messaging/**'
      - 'NeighborGoods.Workers/**'
      - 'NeighborGoods.Functions/**'
      - 'Dockerfile.api'
      - '.github/workflows/backend_ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: |
          dotnet restore NeighborGoods.sln

      - name: Verify backend formatting
        run: |
          dotnet format NeighborGoods.Api/NeighborGoods.Api.csproj --verify-no-changes --verbosity minimal
          dotnet format NeighborGoods.Api.Tests/NeighborGoods.Api.Tests.csproj --verify-no-changes --verbosity minimal
          dotnet format NeighborGoods.Data/NeighborGoods.Data.csproj --verify-no-changes --verbosity minimal
          dotnet format NeighborGoods.Notifications/NeighborGoods.Notifications.csproj --verify-no-changes --verbosity minimal
          dotnet format NeighborGoods.Messaging/NeighborGoods.Messaging.csproj --verify-no-changes --verbosity minimal
          dotnet format NeighborGoods.Workers/NeighborGoods.Workers.csproj --verify-no-changes --verbosity minimal
          dotnet format NeighborGoods.Functions/NeighborGoods.Functions.csproj --verify-no-changes --verbosity minimal

      - name: Build backend
        run: |
          dotnet build NeighborGoods.sln --configuration Release --no-restore

      - name: Run backend unit-only tests (exclude integration tests)
        run: dotnet test NeighborGoods.Api.Tests/NeighborGoods.Api.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName!~EndpointsTests"

