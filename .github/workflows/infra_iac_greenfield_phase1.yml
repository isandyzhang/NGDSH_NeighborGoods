# 全新／第一次：先建 Container App（不綁受控 TLS），並可選在 Azure DNS 寫 CNAME + asuid TXT。
# 完成後請再手動執行「IaC Deploy」，並在該 workflow 將 bind_managed_tls 設為 true（或改 prod 參數檔）以啟用 HTTPS 自訂網域。
name: IaC Deploy (Greenfield phase 1)

on:
  workflow_dispatch:
    inputs:
      provision_azure_dns:
        type: boolean
        description: 是否在 Azure DNS 建立 api CNAME 與 asuid TXT（須已存在 DNS zone，且 api 主機名須符合 deploy.parameters.prod.json）
        default: false
      api_dns_zone_name:
        type: string
        description: Azure DNS 區域名（例 neighborgoodstw.com）。未勾選「建立 DNS」可留空。
        default: ''
      api_dns_zone_resource_group:
        type: string
        description: DNS zone 所在資源群組；留空則使用與 Container App 相同的 AZURE_RESOURCE_GROUP secret。
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure CLI Bicep
        run: az bicep install

      - name: LIFF 設定提示（LineMessagingApi:LiffId）
        env:
          LINE_MESSAGING_LIFF_ID: ${{ secrets.LINE_MESSAGING_LIFF_ID }}
        run: |
          if [ -z "${LINE_MESSAGING_LIFF_ID:-}" ]; then
            echo "::warning title=LIFF::LIFF 尚未設定，請管理員設定 LineMessagingApi:LiffId。（可於 Repository secrets 新增 LINE_MESSAGING_LIFF_ID，或確認 deploy.parameters.prod.json 已設定 lineMessagingLiffId）"
          fi

      - name: Deploy Bicep (phase 1 — 不綁受控 TLS)
        env:
          PROVISION_DNS: ${{ inputs.provision_azure_dns }}
          DNS_ZONE: ${{ inputs.api_dns_zone_name }}
          DNS_ZONE_RG: ${{ inputs.api_dns_zone_resource_group }}
          LINE_MESSAGING_LIFF_ID: ${{ secrets.LINE_MESSAGING_LIFF_ID }}
          # 非機密：建議用 Repository variable（前端公開網址）
          LINE_MESSAGING_WEB_BASE_URL: ${{ vars.LINE_MESSAGING_WEB_BASE_URL }}
        run: |
          set -euo pipefail
          LIFF_EXTRA=""
          if [ -n "${LINE_MESSAGING_LIFF_ID:-}" ]; then
            LIFF_EXTRA="${LIFF_EXTRA} --parameters lineMessagingLiffId=${LINE_MESSAGING_LIFF_ID}"
          fi
          if [ -n "${LINE_MESSAGING_WEB_BASE_URL:-}" ]; then
            LIFF_EXTRA="${LIFF_EXTRA} --parameters lineMessagingWebBaseUrl=${LINE_MESSAGING_WEB_BASE_URL}"
          fi
          EXTRA_DNS=""
          if [ "${PROVISION_DNS}" = "true" ] && [ -n "${DNS_ZONE}" ]; then
            EXTRA_DNS="--parameters provisionApiDnsRecordsInAzureDns=true --parameters apiDnsZoneName='${DNS_ZONE}'"
            if [ -n "${DNS_ZONE_RG}" ]; then
              EXTRA_DNS="${EXTRA_DNS} --parameters apiDnsZoneResourceGroupName='${DNS_ZONE_RG}'"
            fi
          else
            EXTRA_DNS="--parameters provisionApiDnsRecordsInAzureDns=false"
          fi

          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/bicep/deploy.bicep \
            --parameters infra/bicep/deploy.parameters.prod.json \
            --parameters existingSqlConnectionString="${{ secrets.AZURE_SQL_CONNECTION_STRING }}" \
            --parameters existingBlobConnectionString="${{ secrets.AZURE_BLOB_CONNECTION_STRING }}" \
            --parameters sqlAdminLogin="${{ secrets.AZURE_SQL_ADMIN_LOGIN }}" \
            --parameters sqlAdminPassword="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}" \
            --parameters lineOidcChannelSecret="${{ secrets.LINE_OIDC_CHANNEL_SECRET }}" \
            --parameters lineMessagingChannelId="${{ secrets.LINE_MESSAGING_CHANNEL_ID }}" \
            --parameters lineMessagingChannelAccessToken="${{ secrets.LINE_MESSAGING_CHANNEL_ACCESS_TOKEN }}" \
            --parameters lineMessagingChannelSecret="${{ secrets.LINE_MESSAGING_CHANNEL_SECRET }}" \
            --parameters lineMessagingBotId="${{ secrets.LINE_MESSAGING_BOT_ID }}" \
            --parameters jwtSigningKey="${{ secrets.JWT_SIGNING_KEY }}" \
            --parameters containerImage="ghcr.io/${{ github.repository_owner }}/neighborgoods-api:latest" \
            --parameters repositoryUrl="https://github.com/${{ github.repository }}" \
            --parameters apiCustomDomainBindManagedTls=false \
            ${LIFF_EXTRA} \
            ${EXTRA_DNS}

      - name: Next step hint
        run: |
          echo "::notice::Phase 1 完成後，待 DNS 生效，請執行「IaC Deploy」並將 bind_managed_tls 設為 true（或將 deploy.parameters.prod.json 內 apiCustomDomainBindManagedTls 改為 true）以啟用受控 TLS。"
