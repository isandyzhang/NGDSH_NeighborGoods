# 手動發佈 NeighborGoods.Functions（Linux Flex Consumption、FC1、.NET isolated）。
# 需先以 IaC（deploy.bicep + deployFunctionsApp=true）建立 Function App，或於 Azure 手動建立同名資源。
name: Backend CD (Azure Functions)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Functions project
        run: |
          set -euo pipefail
          dotnet publish NeighborGoods.Functions/NeighborGoods.Functions.csproj -c Release -o ./func-publish

      - name: Zip publish output
        run: |
          set -euo pipefail
          (cd func-publish && zip -r ../func-app.zip .)

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy zip to Function App
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            RG="${{ vars.AZURE_RESOURCE_GROUP }}"
            APP="${{ vars.AZURE_FUNCTION_APP_NAME }}"
            if [ -z "${RG}" ] || [ -z "${APP}" ]; then
              echo "Missing repository variables: AZURE_RESOURCE_GROUP or AZURE_FUNCTION_APP_NAME"
              exit 1
            fi
            az config set extension.use_dynamic_install=yes_without_prompt
            # Linux Flex Consumption 不支援 SCM_DO_BUILD_DURING_DEPLOYMENT（舊 IaC 可能已寫入）
            echo "Removing SCM_DO_BUILD_DURING_DEPLOYMENT if present..."
            az functionapp config appsettings delete \
              --resource-group "${RG}" \
              --name "${APP}" \
              --setting-names SCM_DO_BUILD_DURING_DEPLOYMENT \
              || echo "SCM_DO_BUILD_DURING_DEPLOYMENT not set (ok)"
            # Flex / Linux 請用 config-zip（https://learn.microsoft.com/azure/azure-functions/deployment-zip-push）
            az functionapp deployment source config-zip \
              --resource-group "${RG}" \
              --name "${APP}" \
              --src "${{ github.workspace }}/func-app.zip"

      - name: Deployment summary
        run: |
          echo "Deployed Function App: ${{ vars.AZURE_FUNCTION_APP_NAME }} (resource group: ${{ vars.AZURE_RESOURCE_GROUP }})"
